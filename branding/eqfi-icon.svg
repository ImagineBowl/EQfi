<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="120" x2="880" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#FFB595"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="96" x2="512" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5A1E00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded squircle background -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>

  <!-- Equalizer mark: three tracks with sliders -->
  <g filter="url(#soft)" stroke-linecap="round">
    <!-- tracks -->
    <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="30">
      <line x1="360" y1="300" x2="360" y2="724"/>
      <line x1="512" y1="300" x2="512" y2="724"/>
      <line x1="664" y1="300" x2="664" y2="724"/>
    </g>
    <!-- active fill below each knob -->
    <g stroke="#FFFFFF" stroke-width="30">
      <line x1="360" y1="430" x2="360" y2="724"/>
      <line x1="512" y1="600" x2="512" y2="724"/>
      <line x1="664" y1="372" x2="664" y2="724"/>
    </g>
    <!-- knobs -->
    <g fill="#FFFFFF">
      <circle cx="360" cy="430" r="48"/>
      <circle cx="512" cy="600" r="48"/>
      <circle cx="664" cy="372" r="48"/>
    </g>
  </g>
</svg>
